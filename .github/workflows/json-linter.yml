name: Lint JSON Files

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r cli/requirements.txt

      - name: Validate data schemas & referential integrity
        run: python cli/validate_data.py

      - name: Lint JSON Files
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSON: true
          FILTER_REGEX_INCLUDE: .*data/.*
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Source URLs
        run: >-
          for url in $(jq .items[].source_url < data/entries.json); do
            echo $url | grep -q blob && (echo $url | sed -nr \
              's,^"https://github.com/[^\/]*/[^\/]*/blob/([^/]*)/.+$,\1,p' |
              grep -q '[0-9a-f]\{40\}' || (echo \
              "Error: $url does not contain a commit hash." && exit 1));
          done
